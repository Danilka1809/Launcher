name: Build HTA Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create HTA file
        shell: cmd
        run: |
          echo ^<html^> > launcher.hta
          echo ^<head^> >> launcher.hta
          echo ^<meta charset="UTF-8"^> >> launcher.hta
          echo ^<title^>GrifLauncher^</title^> >> launcher.hta
          echo ^<style^> >> launcher.hta
          echo body { background: #0b0e17; font-family: 'Segoe UI', sans-serif; color: white; margin: 0; padding: 20px; } >> launcher.hta
          echo .container { max-width: 1200px; margin: 0 auto; } >> launcher.hta
          echo .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; } >> launcher.hta
          echo .logo { font-size: 28px; font-weight: bold; color: #3b82f6; } >> launcher.hta
          echo .online-badge { background: rgba(59,130,246,0.2); padding: 8px 20px; border-radius: 40px; } >> launcher.hta
          echo .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; margin-bottom: 30px; } >> launcher.hta
          echo .chat-card, .profile-card, .servers-card, .news-card { background: rgba(18,25,45,0.6); border-radius: 32px; padding: 20px; margin-bottom: 20px; } >> launcher.hta
          echo .messages { height: 300px; overflow-y: auto; margin: 15px 0; } >> launcher.hta
          echo .message { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; } >> launcher.hta
          echo .chat-input { display: flex; gap: 10px; } >> launcher.hta
          echo .chat-input input { flex: 1; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #3b82f6; border-radius: 40px; color: white; } >> launcher.hta
          echo button { background: #3b82f6; border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; } >> launcher.hta
          echo .btn-outline { background: transparent; border: 1px solid #3b82f6; } >> launcher.hta
          echo .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #1e3a8a); border-radius: 50%%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; } >> launcher.hta
          echo .input-group { margin-bottom: 15px; } >> launcher.hta
          echo .input-group input { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #3b82f6; border-radius: 12px; color: white; } >> launcher.hta
          echo .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; } >> launcher.hta
          echo .server-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 16px; display: flex; justify-content: space-between; align-items: center; } >> launcher.hta
          echo .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; } >> launcher.hta
          echo .news-item { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 16px; } >> launcher.hta
          echo .footer { text-align: center; font-size: 12px; color: #666; margin-top: 30px; } >> launcher.hta
          echo ^</style^> >> launcher.hta
          echo ^</head^> >> launcher.hta
          echo ^<body^> >> launcher.hta
          echo ^<div class="container"^> >> launcher.hta
          echo ^<div class="header"^>^<div class="logo"^>GRIF LAUNCHER^</div^>^<div class="online-badge"^>12 игроков онлайн^</div^>^</div^> >> launcher.hta
          echo ^<div class="main-grid"^> >> launcher.hta
          echo ^<div class="chat-card"^>^<h3^>Глобальный чат^</h3^>^<div class="messages" id="messagesList"^>^</div^>^<div class="chat-input"^>^<input type="text" id="messageInput" placeholder="Написать..."^>^<button onclick="sendMessage()"^>Отправить^</button^>^</div^>^</div^> >> launcher.hta
          echo ^<div class="profile-card"^>^<div class="avatar"^>🔥^</div^>^<div class="input-group"^>^<input type="text" id="nickInput" placeholder="Никнейм"^>^</div^>^<div class="input-group"^>^<input type="password" id="passInput" placeholder="Пароль"^>^</div^>^<div class="input-group"^>^<input type="password" id="cloudPassInput" placeholder="Облачный пароль"^>^</div^>^<button onclick="openLogin()" class="btn-outline" style="margin-right:8px"^>Вход^</button^>^<button onclick="openRegister()" class="btn-primary"^>Регистрация^</button^>^<div id="userPanel" style="display:none; text-align:center; margin-top:10px"^>^<span id="usernameDisplay"^>^</span^>^<button onclick="logout()"^>Выйти^</button^>^</div^>^<button onclick="saveProfile()" style="width:100%; margin-top:10px"^>Сохранить профиль^</button^>^</div^> >> launcher.hta
          echo ^</div^> >> launcher.hta
          echo ^<div class="servers-card"^>^<h3^>Наши серверы^</h3^>^<div class="servers-grid"^>^<div class="server-card"^>^<div^>^<b^>GrifMC Pro^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>grifmcpro.aternos.me:18014^</span^>^</div^>^<button onclick="playGame('grifmcpro.aternos.me:18014')"^>Играть^</button^>^</div^>^<div class="server-card"^>^<div^>^<b^>Vanilla World^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>vanilla.grifmc.ru:25565^</span^>^</div^>^<button onclick="playGame('vanilla.grifmc.ru:25565')"^>Играть^</button^>^</div^>^<div class="server-card"^>^<div^>^<b^>PvP Arena^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>pvp.grifmc.ru:25565^</span^>^</div^>^<button onclick="playGame('pvp.grifmc.ru:25565')"^>Играть^</button^>^</div^>^</div^>^</div^> >> launcher.hta
          echo ^<div class="news-card"^>^<h3^>Новости и акции^</h3^>^<div class="news-grid"^>^<div class="news-item"^>Новый донат-ранг Легенда^</div^>^<div class="news-item"^>Защита от гриферов^</div^>^<div class="news-item"^>Ивент в субботу^</div^>^</div^>^</div^> >> launcher.hta
          echo ^<div class="footer"^>GrifLauncher — ваш проводник в мир Minecraft^</div^> >> launcher.hta
          echo ^</div^> >> launcher.hta
          echo ^<script^> >> launcher.hta
          echo let users = JSON.parse(localStorage.getItem('griflauncher_users') ^|^| '{}'); >> launcher.hta
          echo let currentUser = localStorage.getItem('griflauncher_current_user'); >> launcher.hta
          echo let messages = JSON.parse(localStorage.getItem('griflauncher_messages') ^|^| '[]'); >> launcher.hta
          echo function renderUI() { >> launcher.hta
          echo   if (currentUser) { >> launcher.hta
          echo     document.getElementById('userPanel').style.display = 'block'; >> launcher.hta
          echo     document.getElementById('usernameDisplay').innerText = currentUser; >> launcher.hta
          echo     let user = users[currentUser]; >> launcher.hta
          echo     if (user) { >> launcher.hta
          echo       document.getElementById('nickInput').value = currentUser; >> launcher.hta
          echo       document.getElementById('passInput').value = user.password; >> launcher.hta
          echo       document.getElementById('cloudPassInput').value = user.cloudPassword; >> launcher.hta
          echo     } >> launcher.hta
          echo   } else { >> launcher.hta
          echo     document.getElementById('userPanel').style.display = 'none'; >> launcher.hta
          echo   } >> launcher.hta
          echo } >> launcher.hta
          echo function openLogin() { >> launcher.hta
          echo   let nick = prompt('Никнейм'); >> launcher.hta
          echo   if (!nick) return; >> launcher.hta
          echo   let pass = prompt('Пароль'); >> launcher.hta
          echo   if (!pass) return; >> launcher.hta
          echo   if (users[nick] ^&^& users[nick].password === pass) { >> launcher.hta
          echo     currentUser = nick; >> launcher.hta
          echo     localStorage.setItem('griflauncher_current_user', currentUser); >> launcher.hta
          echo     renderUI(); >> launcher.hta
          echo     alert('Вход выполнен'); >> launcher.hta
          echo   } else alert('Неверно'); >> launcher.hta
          echo } >> launcher.hta
          echo function openRegister() { >> launcher.hta
          echo   let nick = prompt('Никнейм'); >> launcher.hta
          echo   if (!nick ^|^| users[nick]) { alert('Ник занят'); return; } >> launcher.hta
          echo   let pass = prompt('Пароль'); >> launcher.hta
          echo   if (!pass) return; >> launcher.hta
          echo   let cloudPass = prompt('Облачный пароль'); >> launcher.hta
          echo   if (!cloudPass) return; >> launcher.hta
          echo   users[nick] = { password: pass, cloudPassword: cloudPass }; >> launcher.hta
          echo   localStorage.setItem('griflauncher_users', JSON.stringify(users)); >> launcher.hta
          echo   currentUser = nick; >> launcher.hta
          echo   localStorage.setItem('griflauncher_current_user', currentUser); >> launcher.hta
          echo   renderUI(); >> launcher.hta
          echo   alert('Регистрация успешна'); >> launcher.hta
          echo } >> launcher.hta
          echo function logout() { >> launcher.hta
          echo   currentUser = null; >> launcher.hta
          echo   localStorage.removeItem('griflauncher_current_user'); >> launcher.hta
          echo   renderUI(); >> launcher.hta
          echo } >> launcher.hta
          echo function saveProfile() { >> launcher.hta
          echo   if (!currentUser) { alert('Войдите'); return; } >> launcher.hta
          echo   let nick = document.getElementById('nickInput').value; >> launcher.hta
          echo   let pass = document.getElementById('passInput').value; >> launcher.hta
          echo   let cloudPass = document.getElementById('cloudPassInput').value; >> launcher.hta
          echo   if (nick !== currentUser) { >> launcher.hta
          echo     if (users[nick]) { alert('Ник занят'); return; } >> launcher.hta
          echo     users[nick] = users[currentUser]; >> launcher.hta
          echo     delete users[currentUser]; >> launcher.hta
          echo     currentUser = nick; >> launcher.hta
          echo     localStorage.setItem('griflauncher_current_user', currentUser); >> launcher.hta
          echo   } >> launcher.hta
          echo   users[currentUser] = { password: pass, cloudPassword: cloudPass }; >> launcher.hta
          echo   localStorage.setItem('griflauncher_users', JSON.stringify(users)); >> launcher.hta
          echo   renderUI(); >> launcher.hta
          echo   alert('Сохранено'); >> launcher.hta
          echo } >> launcher.hta
          echo function renderMessages() { >> launcher.hta
          echo   let container = document.getElementById('messagesList'); >> launcher.hta
          echo   container.innerHTML = ''; >> launcher.hta
          echo   messages.forEach(msg =^> { >> launcher.hta
          echo     let div = document.createElement('div'); >> launcher.hta
          echo     div.className = 'message'; >> launcher.hta
          echo     div.innerHTML = '<b>' + msg.author + ':</b> ' + msg.text; >> launcher.hta
          echo     container.appendChild(div); >> launcher.hta
          echo   }); >> launcher.hta
          echo } >> launcher.hta
          echo function sendMessage() { >> launcher.hta
          echo   let input = document.getElementById('messageInput'); >> launcher.hta
          echo   let text = input.value.trim(); >> launcher.hta
          echo   if (!text) return; >> launcher.hta
          echo   let author = currentUser ^|^| 'Гость'; >> launcher.hta
          echo   messages.push({ author: author, text: text, time: Date.now() }); >> launcher.hta
          echo   localStorage.setItem('griflauncher_messages', JSON.stringify(messages)); >> launcher.hta
          echo   input.value = ''; >> launcher.hta
          echo   renderMessages(); >> launcher.hta
          echo } >> launcher.hta
          echo function playGame(ip) { >> launcher.hta
          echo   window.location.href = 'minecraft://?server=' + ip; >> launcher.hta
          echo } >> launcher.hta
          echo setInterval(() =^> { >> launcher.hta
          echo   messages = JSON.parse(localStorage.getItem('griflauncher_messages') ^|^| '[]'); >> launcher.hta
          echo   renderMessages(); >> launcher.hta
          echo }, 2000); >> launcher.hta
          echo renderUI(); >> launcher.hta
          echo renderMessages(); >> launcher.hta
          echo ^</script^> >> launcher.hta
          echo ^</body^> >> launcher.hta
          echo ^</html^> >> launcher.hta

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrifLauncher
          path: launcher.hta
