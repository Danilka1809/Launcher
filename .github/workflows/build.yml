name: Build HTA Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create launcher
        shell: cmd
        run: |
          chcp 65001 > nul
          (
            echo ^<html^>^<head^>^<meta charset="UTF-8"^>^<title^>GrifLauncher^</title^>^<style^>
            echo body { background: #0b0e17; font-family: 'Segoe UI', sans-serif; color: white; margin: 0; padding: 20px; }
            echo .container { max-width: 1200px; margin: 0 auto; }
            echo .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
            echo .logo { font-size: 28px; font-weight: bold; color: #3b82f6; }
            echo .online-badge { background: rgba(59,130,246,0.2); padding: 8px 20px; border-radius: 40px; }
            echo .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; margin-bottom: 30px; }
            echo .chat-card, .profile-card, .servers-card, .news-card { background: rgba(18,25,45,0.6); border-radius: 32px; padding: 20px; margin-bottom: 20px; }
            echo .messages { height: 300px; overflow-y: auto; margin: 15px 0; }
            echo .message { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; }
            echo .chat-input { display: flex; gap: 10px; }
            echo .chat-input input { flex: 1; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #3b82f6; border-radius: 40px; color: white; }
            echo button { background: #3b82f6; border: none; padding: 8px 20px; border-radius: 40px; color: white; cursor: pointer; }
            echo .btn-outline { background: transparent; border: 1px solid #3b82f6; }
            echo .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #3b82f6, #1e3a8a); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
            echo .input-group { margin-bottom: 15px; }
            echo .input-group input { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #3b82f6; border-radius: 12px; color: white; }
            echo .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
            echo .server-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
            echo .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; }
            echo .news-item { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 16px; }
            echo .footer { text-align: center; font-size: 12px; color: #666; margin-top: 30px; }
            echo ^</style^>^</head^>^<body^>
            echo ^<div class="container"^>
            echo ^<div class="header"^>^<div class="logo"^>GRIF LAUNCHER^</div^>^<div class="online-badge"^>12 игроков онлайн^</div^>^</div^>
            echo ^<div class="main-grid"^>
            echo ^<div class="chat-card"^>^<h3^>Глобальный чат^</h3^>^<div class="messages" id="messagesList"^>^</div^>^<div class="chat-input"^>^<input type="text" id="messageInput" placeholder="Написать..."^>^<button onclick="sendMessage()"^>Отправить^</button^>^</div^>^</div^>
            echo ^<div class="profile-card"^>^<div class="avatar"^>🔥^</div^>^<div class="input-group"^>^<input type="text" id="nickInput" placeholder="Никнейм"^>^</div^>^<div class="input-group"^>^<input type="password" id="passInput" placeholder="Пароль"^>^</div^>^<div class="input-group"^>^<input type="password" id="cloudPassInput" placeholder="Облачный пароль"^>^</div^>^<button onclick="openLogin()" class="btn-outline" style="margin-right:8px"^>Вход^</button^>^<button onclick="openRegister()" class="btn-primary"^>Регистрация^</button^>^<div id="userPanel" style="display:none; text-align:center; margin-top:10px"^>^<span id="usernameDisplay"^>^</span^>^<button onclick="logout()"^>Выйти^</button^>^</div^>^<button onclick="saveProfile()" style="width:100%; margin-top:10px"^>Сохранить профиль^</button^>^</div^>
            echo ^</div^>
            echo ^<div class="servers-card"^>^<h3^>Наши серверы^</h3^>^<div class="servers-grid"^>^<div class="server-card"^>^<div^>^<b^>GrifMC Pro^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>grifmcpro.aternos.me:18014^</span^>^</div^>^<button onclick="playGame('grifmcpro.aternos.me:18014')"^>Играть^</button^>^</div^>^<div class="server-card"^>^<div^>^<b^>Vanilla World^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>vanilla.grifmc.ru:25565^</span^>^</div^>^<button onclick="playGame('vanilla.grifmc.ru:25565')"^>Играть^</button^>^</div^>^<div class="server-card"^>^<div^>^<b^>PvP Arena^</b^>^<br^>^<span style="font-family:monospace; font-size:12px; color:#3b82f6"^>pvp.grifmc.ru:25565^</span^>^</div^>^<button onclick="playGame('pvp.grifmc.ru:25565')"^>Играть^</button^>^</div^>^</div^>^</div^>
            echo ^<div class="news-card"^>^<h3^>Новости и акции^</h3^>^<div class="news-grid"^>^<div class="news-item"^>Новый донат-ранг Легенда^</div^>^<div class="news-item"^>Защита от гриферов^</div^>^<div class="news-item"^>Ивент в субботу^</div^>^</div^>^</div^>
            echo ^<div class="footer"^>GrifLauncher — ваш проводник в мир Minecraft^</div^>
            echo ^</div^>
            echo ^<script^>
            echo let users = JSON.parse(localStorage.getItem('griflauncher_users') ^|^| '{}');
            echo let currentUser = localStorage.getItem('griflauncher_current_user');
            echo let messages = JSON.parse(localStorage.getItem('griflauncher_messages') ^|^| '[]');
            echo function renderUI() {
            echo   if (currentUser) {
            echo     document.getElementById('userPanel').style.display = 'block';
            echo     document.getElementById('usernameDisplay').innerText = currentUser;
            echo     let user = users[currentUser];
            echo     if (user) {
            echo       document.getElementById('nickInput').value = currentUser;
            echo       document.getElementById('passInput').value = user.password;
            echo       document.getElementById('cloudPassInput').value = user.cloudPassword;
            echo     }
            echo   } else {
            echo     document.getElementById('userPanel').style.display = 'none';
            echo   }
            echo }
            echo function openLogin() {
            echo   let nick = prompt('Никнейм');
            echo   if (!nick) return;
            echo   let pass = prompt('Пароль');
            echo   if (!pass) return;
            echo   if (users[nick] ^&^& users[nick].password === pass) {
            echo     currentUser = nick;
            echo     localStorage.setItem('griflauncher_current_user', currentUser);
            echo     renderUI();
            echo     alert('Вход выполнен');
            echo   } else alert('Неверно');
            echo }
            echo function openRegister() {
            echo   let nick = prompt('Никнейм');
            echo   if (!nick ^|^| users[nick]) { alert('Ник занят'); return; }
            echo   let pass = prompt('Пароль');
            echo   if (!pass) return;
            echo   let cloudPass = prompt('Облачный пароль');
            echo   if (!cloudPass) return;
            echo   users[nick] = { password: pass, cloudPassword: cloudPass };
            echo   localStorage.setItem('griflauncher_users', JSON.stringify(users));
            echo   currentUser = nick;
            echo   localStorage.setItem('griflauncher_current_user', currentUser);
            echo   renderUI();
            echo   alert('Регистрация успешна');
            echo }
            echo function logout() {
            echo   currentUser = null;
            echo   localStorage.removeItem('griflauncher_current_user');
            echo   renderUI();
            echo }
            echo function saveProfile() {
            echo   if (!currentUser) { alert('Войдите'); return; }
            echo   let nick = document.getElementById('nickInput').value;
            echo   let pass = document.getElementById('passInput').value;
            echo   let cloudPass = document.getElementById('cloudPassInput').value;
            echo   if (nick !== currentUser) {
            echo     if (users[nick]) { alert('Ник занят'); return; }
            echo     users[nick] = users[currentUser];
            echo     delete users[currentUser];
            echo     currentUser = nick;
            echo     localStorage.setItem('griflauncher_current_user', currentUser);
            echo   }
            echo   users[currentUser] = { password: pass, cloudPassword: cloudPass };
            echo   localStorage.setItem('griflauncher_users', JSON.stringify(users));
            echo   renderUI();
            echo   alert('Сохранено');
            echo }
            echo function renderMessages() {
            echo   let container = document.getElementById('messagesList');
            echo   container.innerHTML = '';
            echo   messages.forEach(msg =^> {
            echo     let div = document.createElement('div');
            echo     div.className = 'message';
            echo     div.innerHTML = '<b>' + msg.author + ':</b> ' + msg.text;
            echo     container.appendChild(div);
            echo   });
            echo }
            echo function sendMessage() {
            echo   let input = document.getElementById('messageInput');
            echo   let text = input.value.trim();
            echo   if (!text) return;
            echo   let author = currentUser ^|^| 'Гость';
            echo   messages.push({ author: author, text: text, time: Date.now() });
            echo   localStorage.setItem('griflauncher_messages', JSON.stringify(messages));
            echo   input.value = '';
            echo   renderMessages();
            echo }
            echo function playGame(ip) {
            echo   window.location.href = 'minecraft://?server=' + ip;
            echo }
            echo setInterval(() =^> {
            echo   messages = JSON.parse(localStorage.getItem('griflauncher_messages') ^|^| '[]');
            echo   renderMessages();
            echo }, 2000);
            echo renderUI();
            echo renderMessages();
            echo ^</script^>
            echo ^</body^>^</html^>
          ) > launcher.hta

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrifLauncher
          path: launcher.hta
