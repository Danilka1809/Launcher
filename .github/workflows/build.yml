name: Build HTA Launcher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create launcher
        shell: cmd
        run: |
          echo ^<html^> > launcher.hta
          echo ^<head^> >> launcher.hta
          echo ^<title^>Grif Launcher^</title^> >> launcher.hta
          echo ^<style^> >> launcher.hta
          echo body { background: #0a0f1a; color: white; font-family: sans-serif; text-align: center; padding: 50px; } >> launcher.hta
          echo button { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 20px; cursor: pointer; } >> launcher.hta
          echo ^</style^> >> launcher.hta
          echo ^</head^> >> launcher.hta
          echo ^<body^> >> launcher.hta
          echo ^<h1^>🔥 GRIF LAUNCHER^</h1^> >> launcher.hta
          echo ^<p^>IP: grifmcpro.aternos.me:18014^</p^> >> launcher.hta
          echo ^<button onclick="window.location.href='minecraft://?server=grifmcpro.aternos.me:18014'"^>🎮 ИГРАТЬ^</button^> >> launcher.hta
          echo ^</body^> >> launcher.hta
          echo ^</html^> >> launcher.hta

      - name: Create ZIP
        run: Compress-Archive -Path launcher.hta -DestinationPath GrifLauncher.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrifLauncher
          path: GrifLauncher.zip
