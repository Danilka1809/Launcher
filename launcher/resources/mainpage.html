<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grif Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0f1724 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        .chat-section {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
        }

        .messages {
            height: 500px;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 10px 15px;
        }

        .message-mine {
            background: #3b82f6;
            align-self: flex-end;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3b82f6;
            border-radius: 40px;
            color: white;
        }

        .profile-section {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6, #1e3a8a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">GRIF LAUNCHER</div>
        <div id="authButtons">
            <button class="btn btn-outline" onclick="openLogin()">Вход</button>
            <button class="btn btn-primary" onclick="openRegister()">Регистрация</button>
        </div>
        <div id="userPanel" style="display: none;">
            <span id="usernameDisplay"></span>
            <button class="btn btn-outline" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="chat-section">
            <h3>🌐 Глобальный чат</h3>
            <div class="messages" id="messagesList"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Написать...">
                <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <div class="profile-section">
            <div class="avatar">🔥</div>
            <div class="input-group">
                <input type="text" id="nickInput" placeholder="Никнейм">
            </div>
            <div class="input-group">
                <input type="password" id="passInput" placeholder="Пароль">
            </div>
            <div class="input-group">
                <input type="password" id="cloudPassInput" placeholder="Облачный пароль">
            </div>
            <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            <button class="btn btn-outline" onclick="playGame()" style="margin-top: 10px;">🎮 ИГРАТЬ</button>
        </div>
    </div>
</div>

<script>
    let users = JSON.parse(localStorage.getItem('griflauncher_users') || '{}');
    let currentUser = localStorage.getItem('griflauncher_current_user');
    let messages = JSON.parse(localStorage.getItem('griflauncher_messages') || '[]');

    function renderUI() {
        if (currentUser) {
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userPanel').style.display = 'flex';
            document.getElementById('usernameDisplay').innerText = currentUser;
            let user = users[currentUser];
            if (user) {
                document.getElementById('nickInput').value = currentUser;
                document.getElementById('passInput').value = user.password;
                document.getElementById('cloudPassInput').value = user.cloudPassword;
            }
        } else {
            document.getElementById('authButtons').style.display = 'flex';
            document.getElementById('userPanel').style.display = 'none';
        }
    }

    function openLogin() {
        let nick = prompt('Никнейм');
        if (!nick) return;
        let pass = prompt('Пароль');
        if (!pass) return;
        if (users[nick] && users[nick].password === pass) {
            currentUser = nick;
            localStorage.setItem('griflauncher_current_user', currentUser);
            renderUI();
            alert('Вход выполнен!');
        } else alert('Неверный логин или пароль');
    }

    function openRegister() {
        let nick = prompt('Никнейм');
        if (!nick || users[nick]) { alert('Ник занят'); return; }
        let pass = prompt('Пароль');
        if (!pass) return;
        let cloudPass = prompt('Облачный пароль');
        if (!cloudPass) return;
        users[nick] = { password: pass, cloudPassword: cloudPass };
        localStorage.setItem('griflauncher_users', JSON.stringify(users));
        currentUser = nick;
        localStorage.setItem('griflauncher_current_user', currentUser);
        renderUI();
        alert('Регистрация успешна!');
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('griflauncher_current_user');
        renderUI();
    }

    function saveProfile() {
        if (!currentUser) { alert('Сначала войдите'); return; }
        let nick = document.getElementById('nickInput').value;
        let pass = document.getElementById('passInput').value;
        let cloudPass = document.getElementById('cloudPassInput').value;
        if (nick !== currentUser) {
            if (users[nick]) { alert('Ник занят'); return; }
            users[nick] = users[currentUser];
            delete users[currentUser];
            currentUser = nick;
            localStorage.setItem('griflauncher_current_user', currentUser);
        }
        users[currentUser] = { password: pass, cloudPassword: cloudPass };
        localStorage.setItem('griflauncher_users', JSON.stringify(users));
        renderUI();
        alert('Профиль сохранён!');
    }

    function renderMessages() {
        let container = document.getElementById('messagesList');
        container.innerHTML = '';
        messages.forEach(msg => {
            let div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<b>${msg.author}:</b> ${msg.text}`;
            container.appendChild(div);
        });
    }

    function sendMessage() {
        let input = document.getElementById('messageInput');
        let text = input.value.trim();
        if (!text) return;
        let author = currentUser || 'Гость';
        messages.push({ author, text, time: Date.now() });
        localStorage.setItem('griflauncher_messages', JSON.stringify(messages));
        input.value = '';
        renderMessages();
    }

    function playGame() {
        window.location.href = "minecraft://?server=grifmcpro.aternos.me:18014";
    }

    setInterval(() => {
        messages = JSON.parse(localStorage.getItem('griflauncher_messages') || '[]');
        renderMessages();
    }, 2000);

    renderUI();
    renderMessages();
</script>
</body>
</html>
